worker_processes 1;

events {
    worker_connections 512;
}

http {
    access_log off;
    error_log  /dev/stderr warn;

    upstream api {
        server api1:3000;
        server api2:3000;
        keepalive 32;
    }

    server {
        listen 9999;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   Connection "";
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
    }
}
