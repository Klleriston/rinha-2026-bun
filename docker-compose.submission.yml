services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"

  api1:
    image: klleriston/rinha-2026-bun:latest|g
    platform: linux/amd64
    environment:
      PORT: "3000"
    networks:
      - rinha-net
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"const r=await fetch('http://localhost:3000/ready').catch(()=>null);process.exit(r?.ok?0:1)\""]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    image: klleriston/rinha-2026-bun:latest|g
    platform: linux/amd64
    environment:
      PORT: "3000"
    networks:
      - rinha-net
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"const r=await fetch('http://localhost:3000/ready').catch(()=>null);process.exit(r?.ok?0:1)\""]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  rinha-net:
    driver: bridge
